<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Plus Jakarta Sans, Inter, sans-serif">
  <rect width="1200" height="675" fill="#f6f3ff"/>
  <text x="600" y="76" text-anchor="middle" font-size="44" font-weight="800" fill="#1c1640">From logo wall to pipeline engine</text>
  <text x="600" y="118" text-anchor="middle" font-size="24" fill="#5b3df5">Five habits of partner programs that ship pipeline</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1640"/>
    </marker>
  </defs>
  <g font-size="22" fill="#ffffff" text-anchor="middle">
    <rect x="40" y="170" width="200" height="270" rx="22" fill="#5b3df5"/>
    <text x="140" y="222" font-size="26" font-weight="700" fill="#ffd84d">01</text>
    <text x="140" y="268" font-size="30" font-weight="800">Money</text>
    <text x="140" y="318">How does the</text>
    <text x="140" y="348">partner earn?</text>
    <text x="140" y="378">Two sentences</text>

    <rect x="270" y="170" width="200" height="270" rx="22" fill="#7c5cff"/>
    <text x="370" y="222" font-size="26" font-weight="700" fill="#ffd84d">02</text>
    <text x="370" y="268" font-size="30" font-weight="800">Recruit</text>
    <text x="370" y="318">Fewer, better</text>
    <text x="370" y="348">partners, all</text>
    <text x="370" y="378">screened first</text>

    <rect x="500" y="170" width="200" height="270" rx="22" fill="#b43ea0"/>
    <text x="600" y="222" font-size="26" font-weight="700" fill="#ffd84d">03</text>
    <text x="600" y="268" font-size="30" font-weight="800">Map</text>
    <text x="600" y="318">Five named</text>
    <text x="600" y="348">accounts at the</text>
    <text x="600" y="378">first meeting</text>

    <rect x="730" y="170" width="200" height="270" rx="22" fill="#7c5cff"/>
    <text x="830" y="222" font-size="26" font-weight="700" fill="#ffd84d">04</text>
    <text x="830" y="268" font-size="30" font-weight="800">Enable</text>
    <text x="830" y="318">Pitch, demo and</text>
    <text x="830" y="348">deal reg they run</text>
    <text x="830" y="378">without you</text>

    <rect x="960" y="170" width="200" height="270" rx="22" fill="#1c1640"/>
    <text x="1060" y="222" font-size="26" font-weight="700" fill="#ffd84d">05</text>
    <text x="1060" y="268" font-size="30" font-weight="800">Run</text>
    <text x="1060" y="318">Weekly calls,</text>
    <text x="1060" y="348">monthly reviews,</text>
    <text x="1060" y="378">quarterly cuts</text>
  </g>
  <g stroke="#1c1640" stroke-width="4" marker-end="url(#arr)">
    <line x1="242" y1="305" x2="266" y2="305"/>
    <line x1="472" y1="305" x2="496" y2="305"/>
    <line x1="702" y1="305" x2="726" y2="305"/>
    <line x1="932" y1="305" x2="956" y2="305"/>
  </g>
  <rect x="40" y="480" width="540" height="150" rx="22" fill="#ffffff" stroke="#b43ea0" stroke-width="3"/>
  <text x="310" y="530" text-anchor="middle" font-size="28" font-weight="800" fill="#b43ea0">Logo wall</text>
  <text x="310" y="570" text-anchor="middle" font-size="22" fill="#1c1640">30 partners signed, one webinar,</text>
  <text x="310" y="600" text-anchor="middle" font-size="22" fill="#1c1640">no deals tagged in the CRM</text>
  <rect x="620" y="480" width="540" height="150" rx="22" fill="#ffd84d"/>
  <text x="890" y="530" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1640">Pipeline engine</text>
  <text x="890" y="570" text-anchor="middle" font-size="22" fill="#1c1640">Active partners, sourced and influenced</text>
  <text x="890" y="600" text-anchor="middle" font-size="22" fill="#1c1640">pipeline, time to first registered deal</text>
</svg>
