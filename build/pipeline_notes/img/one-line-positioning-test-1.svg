<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Plus Jakarta Sans, Inter, sans-serif">
  <rect width="1200" height="675" fill="#f6f3ff"/>
  <text x="600" y="78" text-anchor="middle" font-size="44" font-weight="800" fill="#1c1640">The one line test</text>
  <text x="600" y="122" text-anchor="middle" font-size="24" fill="#5b3df5">Score your homepage hero on four questions, then run two checks</text>
  <g>
    <rect x="60" y="160" width="252" height="250" rx="22" fill="#5b3df5"/>
    <text x="186" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#ffd84d">01</text>
    <text x="186" y="262" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">Who</text>
    <text x="186" y="318" text-anchor="middle" font-size="22" fill="#ffffff">A buyer so specific</text>
    <text x="186" y="348" text-anchor="middle" font-size="22" fill="#ffffff">the wrong buyer</text>
    <text x="186" y="378" text-anchor="middle" font-size="22" fill="#ffffff">feels left out</text>
  </g>
  <g>
    <rect x="336" y="160" width="252" height="250" rx="22" fill="#7c5cff"/>
    <text x="462" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#ffd84d">02</text>
    <text x="462" y="262" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">Instead of</text>
    <text x="462" y="318" text-anchor="middle" font-size="22" fill="#ffffff">The alternative it</text>
    <text x="462" y="348" text-anchor="middle" font-size="22" fill="#ffffff">replaces, often the</text>
    <text x="462" y="378" text-anchor="middle" font-size="22" fill="#ffffff">status quo</text>
  </g>
  <g>
    <rect x="612" y="160" width="252" height="250" rx="22" fill="#b43ea0"/>
    <text x="738" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#ffd84d">03</text>
    <text x="738" y="262" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">So what</text>
    <text x="738" y="318" text-anchor="middle" font-size="22" fill="#ffffff">An outcome tied to</text>
    <text x="738" y="348" text-anchor="middle" font-size="22" fill="#ffffff">revenue, cost or risk,</text>
    <text x="738" y="378" text-anchor="middle" font-size="22" fill="#ffffff">not a feature</text>
  </g>
  <g>
    <rect x="888" y="160" width="252" height="250" rx="22" fill="#1c1640"/>
    <text x="1014" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#ffd84d">04</text>
    <text x="1014" y="262" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">What kind</text>
    <text x="1014" y="318" text-anchor="middle" font-size="22" fill="#ffffff">A category that sets</text>
    <text x="1014" y="348" text-anchor="middle" font-size="22" fill="#ffffff">the right price and</text>
    <text x="1014" y="378" text-anchor="middle" font-size="22" fill="#ffffff">rival expectations</text>
  </g>
  <rect x="60" y="440" width="528" height="140" rx="22" fill="#ffffff" stroke="#5b3df5" stroke-width="3"/>
  <text x="324" y="490" text-anchor="middle" font-size="30" font-weight="800" fill="#1c1640">Swap check</text>
  <text x="324" y="530" text-anchor="middle" font-size="22" fill="#1c1640">Put a rival's name in your line.</text>
  <text x="324" y="560" text-anchor="middle" font-size="22" fill="#1c1640">Still true? It does not differentiate.</text>
  <rect x="612" y="440" width="528" height="140" rx="22" fill="#ffffff" stroke="#b43ea0" stroke-width="3"/>
  <text x="876" y="490" text-anchor="middle" font-size="30" font-weight="800" fill="#1c1640">Stranger check</text>
  <text x="876" y="530" text-anchor="middle" font-size="22" fill="#1c1640">Five seconds with an ICP buyer.</text>
  <text x="876" y="560" text-anchor="middle" font-size="22" fill="#1c1640">Can they say who and what it replaces?</text>
  <rect x="160" y="604" width="880" height="48" rx="24" fill="#ffd84d"/>
  <text x="600" y="636" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1640">Category for a specific buyer that delivers an outcome, without the old way</text>
</svg>
