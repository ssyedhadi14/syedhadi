<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<rect width="1200" height="675" fill="#ffffff"/>
<text x="600" y="70" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="40" font-weight="800" fill="#1c1640">The six week launch calendar</text>
