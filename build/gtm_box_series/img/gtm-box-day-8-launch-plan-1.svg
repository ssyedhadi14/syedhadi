<circle cx="95.0" cy="330" r="26" fill="#7c5cff" stroke="#ffffff" stroke-width="4"/>
<text x="95.0" y="250" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="24" font-weight="800" fill="#7c5cff">T minus 4</text>
<text x="95.0" y="200" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">Lock the</text>
<text x="95.0" y="226" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">story</text>
<circle cx="263.33333333333337" cy="330" r="26" fill="#7c5cff" stroke="#ffffff" stroke-width="4"/>
<text x="263.33333333333337" y="420" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="24" font-weight="800" fill="#7c5cff">T minus 3</text>
<text x="263.33333333333337" y="455" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">Open</text>
<text x="263.33333333333337" y="481" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">registration</text>
<circle cx="431.6666666666667" cy="330" r="26" fill="#7c5cff" stroke="#ffffff" stroke-width="4"/>
