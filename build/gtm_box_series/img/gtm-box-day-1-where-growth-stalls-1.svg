<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Plus Jakarta Sans, Inter, sans-serif">
  <rect width="1200" height="675" fill="#f6f3ff"/>
  <text x="600" y="72" text-anchor="middle" font-size="40" font-weight="800" fill="#1c1640">GTM in a Box, the 10 day build</text>
  <text x="600" y="112" text-anchor="middle" font-size="24" fill="#5b3df5">Day 1 finds the stall. Days 2 to 10 fix it in three phases.</text>
  <line x1="80" y1="190" x2="1120" y2="190" stroke="#1c1640" stroke-width="4"/>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="100" cy="190" r="24" fill="#ffd84d" stroke="#1c1640" stroke-width="3"/><text x="100" y="198" fill="#1c1640">1</text>
    <circle cx="210" cy="190" r="24" fill="#5b3df5"/><text x="210" y="198" fill="#ffffff">2</text>
    <circle cx="320" cy="190" r="24" fill="#5b3df5"/><text x="320" y="198" fill="#ffffff">3</text>
    <circle cx="430" cy="190" r="24" fill="#5b3df5"/><text x="430" y="198" fill="#ffffff">4</text>
    <circle cx="540" cy="190" r="24" fill="#5b3df5"/><text x="540" y="198" fill="#ffffff">5</text>
    <circle cx="650" cy="190" r="24" fill="#7c5cff"/><text x="650" y="198" fill="#ffffff">6</text>
    <circle cx="760" cy="190" r="24" fill="#7c5cff"/><text x="760" y="198" fill="#ffffff">7</text>
    <circle cx="870" cy="190" r="24" fill="#7c5cff"/><text x="870" y="198" fill="#ffffff">8</text>
    <circle cx="980" cy="190" r="24" fill="#7c5cff"/><text x="980" y="198" fill="#ffffff">9</text>
    <circle cx="1090" cy="190" r="24" fill="#b43ea0"/><text x="1090" y="198" fill="#ffffff">10</text>
  </g>
  <text x="100" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1640">Stall</text>
  <text x="100" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1640">check</text>
  <!-- Phase 1 -->
  <rect x="170" y="300" width="410" height="320" rx="20" fill="#ffffff" stroke="#5b3df5" stroke-width="4"/>
  <rect x="170" y="300" width="410" height="70" rx="20" fill="#5b3df5"/>
  <rect x="170" y="340" width="410" height="30" fill="#5b3df5"/>
  <text x="375" y="346" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">01 Diagnose and decide</text>
  <g font-size="22" fill="#1c1640">
    <text x="195" y="414">Day 2  ICP from closed won</text>
    <text x="195" y="464">Day 3  Pipeline and win loss</text>
    <text x="195" y="514">Day 4  Competitor and pricing</text>
    <text x="195" y="564">Day 5  One page GTM plan</text>
  </g>
  <!-- Phase 2 -->
  <rect x="610" y="300" width="410" height="320" rx="20" fill="#ffffff" stroke="#7c5cff" stroke-width="4"/>
  <rect x="610" y="300" width="410" height="70" rx="20" fill="#7c5cff"/>
  <rect x="610" y="340" width="410" height="30" fill="#7c5cff"/>
  <text x="815" y="346" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">02 Build and launch</text>
  <g font-size="22" fill="#1c1640">
    <text x="635" y="414">Day 6  Outbound motion</text>
    <text x="635" y="464">Day 7  Partner program</text>
    <text x="635" y="514">Day 8  Launch plan</text>
    <text x="635" y="564">Day 9  Attribution dashboard</text>
  </g>
  <!-- Phase 3 -->
  <rect x="1040" y="300" width="130" height="320" rx="20" fill="#b43ea0"/>
  <text x="1105" y="350" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">03</text>
  <text x="1105" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Run</text>
  <text x="1105" y="430" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">and</text>
  <text x="1105" y="460" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">scale</text>
  <text x="1105" y="530" text-anchor="middle" font-size="22" fill="#ffd84d">Day 10</text>
  <text x="1105" y="560" text-anchor="middle" font-size="22" fill="#ffffff">Team</text>
  <text x="1105" y="588" text-anchor="middle" font-size="22" fill="#ffffff">playbook</text>
  <text x="600" y="655" text-anchor="middle" font-size="22" fill="#1c1640">Track first, build second, scale third</text>
</svg>
