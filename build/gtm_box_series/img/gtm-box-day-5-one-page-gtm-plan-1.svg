<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<rect width="1200" height="675" fill="#f6f3ff"/>
<text x="600" y="70" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="40" font-weight="800" fill="#1c1640">The one page GTM plan</text>
<text x="600" y="110" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="24" font-weight="600" fill="#5b3df5">Eight boxes, one owner per row, three signatures</text>
<rect x="60" y="135" width="1080" height="520" rx="24" fill="#ffffff" stroke="#1c1640" stroke-width="3"/>
<rect x="90" y="165" width="238" height="155" rx="18" fill="#f6f3ff" stroke="#5b3df5" stroke-width="3"/>
<circle cx="126" cy="203" r="22" fill="#ffd84d"/>
<text x="126" y="211" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="800" fill="#1c1640">1</text>
<text x="158" y="211" text-anchor="start" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="800" fill="#5b3df5">Target</text>
<text x="209" y="277" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">Revenue and pipeline</text>
<rect x="348" y="165" width="238" height="155" rx="18" fill="#f6f3ff" stroke="#7c5cff" stroke-width="3"/>
<circle cx="384" cy="203" r="22" fill="#ffd84d"/>
<text x="384" y="211" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="800" fill="#1c1640">2</text>
<text x="416" y="211" text-anchor="start" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="800" fill="#7c5cff">Segments</text>
<text x="467" y="277" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">Max 3, ranked</text>
<rect x="606" y="165" width="238" height="155" rx="18" fill="#f6f3ff" stroke="#b43ea0" stroke-width="3"/>
<circle cx="642" cy="203" r="22" fill="#ffd84d"/>
<text x="642" y="211" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="800" fill="#1c1640">3</text>
<text x="674" y="211" text-anchor="start" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="800" fill="#b43ea0">Motions</text>
<text x="725" y="277" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">Share of pipeline</text>
<rect x="864" y="165" width="238" height="155" rx="18" fill="#f6f3ff" stroke="#5b3df5" stroke-width="3"/>
<circle cx="900" cy="203" r="22" fill="#ffd84d"/>
<text x="900" y="211" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="800" fill="#1c1640">4</text>
<text x="932" y="211" text-anchor="start" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="800" fill="#5b3df5">Channels</text>
<text x="983" y="277" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">Max 2 per motion</text>
<rect x="90" y="340" width="238" height="155" rx="18" fill="#f6f3ff" stroke="#b43ea0" stroke-width="3"/>
<circle cx="126" cy="378" r="22" fill="#ffd84d"/>
<text x="126" y="386" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="800" fill="#1c1640">5</text>
<text x="158" y="386" text-anchor="start" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="800" fill="#b43ea0">Budget split</text>
<text x="209" y="452" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">Follows pipeline</text>
<rect x="348" y="340" width="238" height="155" rx="18" fill="#f6f3ff" stroke="#5b3df5" stroke-width="3"/>
<circle cx="384" cy="378" r="22" fill="#ffd84d"/>
<text x="384" y="386" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="800" fill="#1c1640">6</text>
<text x="416" y="386" text-anchor="start" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="800" fill="#5b3df5">Owners</text>
<text x="467" y="452" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">One name per row</text>
<rect x="606" y="340" width="238" height="155" rx="18" fill="#f6f3ff" stroke="#5b3df5" stroke-width="3"/>
<circle cx="642" cy="378" r="22" fill="#ffd84d"/>
<text x="642" y="386" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="800" fill="#1c1640">7</text>
<text x="674" y="386" text-anchor="start" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="800" fill="#5b3df5">Metrics</text>
<text x="725" y="452" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">6 weekly numbers</text>
<rect x="864" y="340" width="238" height="155" rx="18" fill="#f6f3ff" stroke="#7c5cff" stroke-width="3"/>
<circle cx="900" cy="378" r="22" fill="#ffd84d"/>
<text x="900" y="386" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="800" fill="#1c1640">8</text>
<text x="932" y="386" text-anchor="start" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="800" fill="#7c5cff">Risks</text>
<text x="983" y="452" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1640">Trigger and response</text>
<rect x="90" y="525" width="1020" height="105" rx="18" fill="#1c1640"/>
<text x="600" y="568" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Signed by sales, marketing and partners</text>
<text x="600" y="606" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="600" fill="#ffd84d">Reviewed every week. Re signed when a risk fires.</text>
</svg>