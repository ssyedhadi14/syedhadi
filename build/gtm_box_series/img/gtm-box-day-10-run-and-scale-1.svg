<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Plus Jakarta Sans, Inter, sans-serif">
  <rect width="1200" height="675" fill="#f6f3ff"/>
  <text x="600" y="64" text-anchor="middle" font-size="36" font-weight="800" fill="#1c1640">The GTM operating rhythm</text>
  <text x="600" y="102" text-anchor="middle" font-size="22" fill="#5b3df5">Three cadences and a quarterly reset keep the engine running</text>

  <!-- timeline line -->
  <line x1="120" y1="200" x2="1080" y2="200" stroke="#1c1640" stroke-width="4"/>
  <circle cx="180" cy="200" r="22" fill="#5b3df5"/>
  <circle cx="460" cy="200" r="22" fill="#7c5cff"/>
  <circle cx="740" cy="200" r="22" fill="#b43ea0"/>
  <circle cx="1020" cy="200" r="22" fill="#ffd84d" stroke="#1c1640" stroke-width="3"/>

  <!-- cards -->
  <rect x="50" y="250" width="260" height="290" rx="18" fill="#5b3df5"/>
  <text x="180" y="300" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">Weekly</text>
  <text x="180" y="338" text-anchor="middle" font-size="22" fill="#ffd84d">with sales, 30 min</text>
  <text x="180" y="394" text-anchor="middle" font-size="22" fill="#ffffff">Pacing vs target</text>
  <text x="180" y="430" text-anchor="middle" font-size="22" fill="#ffffff">New opportunities</text>
  <text x="180" y="466" text-anchor="middle" font-size="22" fill="#ffffff">Stuck deals</text>
  <text x="180" y="502" text-anchor="middle" font-size="22" fill="#ffffff">Owners and dates</text>

  <rect x="330" y="250" width="260" height="290" rx="18" fill="#7c5cff"/>
  <text x="460" y="300" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">Biweekly</text>
  <text x="460" y="338" text-anchor="middle" font-size="22" fill="#ffd84d">with each partner</text>
  <text x="460" y="394" text-anchor="middle" font-size="22" fill="#ffffff">Shared accounts</text>
  <text x="460" y="430" text-anchor="middle" font-size="22" fill="#ffffff">Deal registration</text>
  <text x="460" y="466" text-anchor="middle" font-size="22" fill="#ffffff">Next joint activity</text>

  <rect x="610" y="250" width="260" height="290" rx="18" fill="#b43ea0"/>
  <text x="740" y="300" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">Monthly</text>
  <text x="740" y="338" text-anchor="middle" font-size="22" fill="#ffd84d">with leadership</text>
  <text x="740" y="394" text-anchor="middle" font-size="22" fill="#ffffff">Score every channel</text>
  <text x="740" y="430" text-anchor="middle" font-size="22" fill="#ffffff">Keep the top two</text>
  <text x="740" y="466" text-anchor="middle" font-size="22" fill="#ffffff">Pause the rest</text>

  <rect x="890" y="250" width="260" height="290" rx="18" fill="#ffffff" stroke="#1c1640" stroke-width="3"/>
  <text x="1020" y="300" text-anchor="middle" font-size="30" font-weight="800" fill="#1c1640">Quarterly</text>
  <text x="1020" y="338" text-anchor="middle" font-size="22" fill="#b43ea0">reset</text>
  <text x="1020" y="394" text-anchor="middle" font-size="22" fill="#1c1640">Revisit the ICP</text>
  <text x="1020" y="430" text-anchor="middle" font-size="22" fill="#1c1640">Check positioning</text>
  <text x="1020" y="466" text-anchor="middle" font-size="22" fill="#1c1640">Update the playbook</text>

  <rect x="50" y="572" width="1100" height="70" rx="35" fill="#1c1640"/>
  <text x="600" y="616" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Every decision you repeat twice goes in the <tspan fill="#ffd84d">team playbook</tspan></text>
</svg>
