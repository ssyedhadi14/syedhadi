# Created by: Claude
# Date: 2026-11-03
# Purpose: Cloudflare Pages config for syedcreates.com. Static site in site/, functions in functions/.
# Owner: Syed Hadi
# Secrets (FIRECRAWL_API_KEY, BREVO_API_KEY, OPENSEO_API_KEY, REPORT_*) are set in the Pages dashboard, never here.
name = "syedcreates"
pages_build_output_dir = "site"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# KV for the company research cache and quotas (namespace "syedcreates-cr")
[[kv_namespaces]]
binding = "CR_KV"
id = "deba0bdde3a34bc0975a8688eb20230f"

# Workers AI for the interview prep chatbot (/api/interview-coach). No key needed, uses the account's Workers AI allowance.
[ai]
binding = "AI"
